target_customer:
  description: AI-native developers, students, startups, and small engineering teams
    who want to build, test, and ship software faster in one desktop IDE.
  pain_points:
  - AI can generate code quickly, but testing, debugging, deployment, and maintenance
    are still difficult.
  - Generated code can look finished in a demo but still requires verification before
    production.
  - Building across Web, Android, Desktop, and Backend often requires switching between
    different workflows and tools.
  - AI coding tools accelerate code generation but do not fully handle the end-to-end
    journey from building to verified software.
  - AI tools can generate code quickly, but developers still have to manually test
    whether it actually works.
  - UI bugs can remain hidden because generated code is not automatically tested against
    the real user interface.
  - Developers must manually find bugs, reproduce failures, and debug issues after
    code is generated.
  - There is a gap between AI-generated code and software that has actually been tested
    and verified.
